        function makechart_oee(data) {
            Highcharts.chart('oeeChart', {
                title: { text: data.OEEDataListPP12A[0].TitleOEE },
                xAxis: {
                    type: 'datetime',
                    categories: data.OEEDataListPP12A.map(d => d.DateString),
                    labels: {
                        rotation: 35,  // หมุน 65 องศาทวนเข็มนาฬิกา ค่าเดิมคือ -45
                        style: {
                            fontSize: '11px'
                        }
                    },
                    crosshair: {
                        color: '#FF0000',     // สีแดง
                        width: 1,             // ความหนา 1px
                        zIndex: 5             // แสดงทับด้านบนของกราฟ
                    }
                },
                yAxis: {
                    title: { text: '%' },
                    gridLineWidth: 0        // ซ่อนเส้นกริดแนวนอน
                },
                plotOptions: {
                    series: {
                        stickyTracking: true,  // ติดตามเมาส์อย่างต่อเนื่อง
                        states: {
                            hover: {
                                enabled: true
                            }
                        }
                    }
                },
                tooltip: {
                    shared: true,
                    backgroundColor: 'rgba(255, 255, 255, 0.95)',  // พื้นหลังสีขาวแบบโปร่งใส
                    borderWidth: 1,
                    borderColor: '#E0E0E0',  // ขอบสีเทาอ่อน
                    borderRadius: 8,         // มุมโค้ง
                    shadow: true,           // เพิ่มเงา
                    style: {
                        color: '#333333',    // สีตัวอักษร
                        fontSize: '12px',
                        fontFamily: 'Arial, sans-serif'
                    },
                    useHTML: true,
                    crosshairs: [{
                        color: '#FF0000',
                        width: 1,
                        dashStyle: 'Solid'
                    }],
                    formatter: function() {
                        let remarks = this.points[0].point.remarks || [];
                        let remarkHtml = remarks.length > 0 
                            ? '<div style="margin-top:8px;padding:8px;background:#F8F9FA;border-radius:4px;">' +
                              remarks.map(r => '<div style="color:#666;margin:4px 0;">\u2022 ' + r + '</div>').join('') +
                              '</div>'
                            : '<div style="color:#666;margin-top:4px;">No Remarks</div>';
                        
                        let date = this.points[0].key || this.x;
                        let tooltipHtml = `<div style="padding:4px 0"><b>Date: ${date}</b></div>`;
                        
                        // ปรับแต่งการจัดวางข้อมูล
                        this.points.forEach(point => {
                            tooltipHtml += `
                                <div style="display:grid;grid-template-columns:140px auto;align-items:center;margin:4px 0">
                                    <div style="display:flex;align-items:center;">
                                        <span style="color:${point.color};margin-right:5px">\u25CF</span>
                                        <span>${point.series.name}:</span>
                                    </div>
                                    <div style="text-align:left;padding-left:10px">
                                        <b>${point.y}%</b>
                                    </div>
                                </div>`;
                        });
                        
                        tooltipHtml += `<div style="margin-top:8px;border-top:1px solid #E0E0E0;padding-top:8px">
                            <b>Remarks:</b>${remarkHtml}
                        </div>`;
                        
                        return tooltipHtml;
                    }
                },
                series: [{
                    name: 'OEE',
                    type: 'column',
                    data: data.OEEDataListPP12A.map(d => ({
                        y: d.OEE,
                        color: d.Color,  // สีถูกกำหนดจาก backend
                        remarks: d.Remarks
                    }))
                }, {
                    name: 'Availability',
                    type: 'line',
                    color: '#4572A7',  // สีฟ้าเข้ม - ดูเป็นมืออาชีพ
                    lineWidth: 2,
                    marker: {
                        symbol: 'circle',
                        radius: 4
                    },
                    data: data.OEEDataListPP12A.map(d => d.Availability)
                }, {
                    name: 'Performance',
                    type: 'line',
                    color: '#AA4643',  // สีส้มแดง - ดูมีพลัง
                    lineWidth: 2,
                    marker: {
                        symbol: 'diamond',
                        radius: 4
                    },
                    data: data.OEEDataListPP12A.map(d => d.Performance)
                }, {
                    name: 'Quality',
                    type: 'line',
                    color: '#89A54E',  // สีเขียวอ่อน - ดูสบายตา
                    lineWidth: 2,
                    marker: {
                        symbol: 'triangle',
                        radius: 4
                    },
                    data: data.OEEDataListPP12A.map(d => d.Quality)
                }, {
                    name: 'Target',
                    type: 'line',
                    color: '#FF0000',  // คงสีแดงไว้ตามเดิม
                    dashStyle: 'Solid',
                    lineWidth: 2,
                    data: data.OEEDataListPP12A.map(d => d.OeeTarget),
                    marker: {
                        enabled: false
                    }
                }]
            });
        }

        function makechart_give_away(data) {
            const filteredData = data.filter(r => r.OEE > 0);
            Highcharts.chart('giveawayChart', {
                title: { text: data[0].TitleGiveAway },
                xAxis: {
                    type: 'datetime',
                    categories: filteredData.map(d => d.DateString),
                    crosshair: {
                        color: '#FF0000',
                        width: 1,
                        zIndex: 5
                    }
                },
                yAxis: {
                    title: { text: 'kg' },
                    gridLineWidth: 0
                },
                tooltip: {
                    shared: true,
                    backgroundColor: 'rgba(255, 255, 255, 0.95)',
                    borderWidth: 1,
                    borderColor: '#E0E0E0',
                    borderRadius: 8,
                    shadow: true,
                    style: {
                        color: '#333333',
                        fontSize: '12px',
                        fontFamily: 'Arial, sans-serif'
                    },
                    useHTML: true,
                    crosshairs: [{
                        color: '#FF0000',
                        width: 1,
                        dashStyle: 'Solid'
                    }],
                    formatter: function() {
                        let date = this.points[0].key || this.x;
                        let tooltipHtml = `<div style="padding:4px 0"><b>Date: ${date}</b></div>`;
                        
                        this.points.forEach(point => {
                            tooltipHtml += `
                                <div style="display:grid;grid-template-columns:140px auto;align-items:center;margin:4px 0">
                                    <div style="display:flex;align-items:center;">
                                        <span style="color:${point.color};margin-right:5px">\u25CF</span>
                                        <span>${point.series.name}:</span>
                                    </div>
                                    <div style="text-align:left;padding-left:10px">
                                        <b>${point.y}</b>
                                    </div>
                                </div>`;
                        });
                        
                        return tooltipHtml;
                    }
                },
                plotOptions: {
                    series: {
                        stickyTracking: true,
                        states: {
                            hover: {
                                enabled: true
                            }
                        }
                    }
                },
                series: [{
                    name: 'MAX',
                    data: filteredData.map(d => d.GiveAwayMax),
                    color: '#CC0000',
                    dashStyle: 'ShortDash',
                    lineWidth: 2
                }, {
                    name: 'MIN',
                    data: filteredData.map(d => d.GiveAwayMin),
                    color: '#CC0000',
                    dashStyle: 'ShortDash',
                    lineWidth: 2
                }, {
                    name: 'Give Away',
                    data: filteredData.map(d => d.Giveaway),
                    color: '#008000',
                    lineWidth: 2,
                    marker: {
                        symbol: 'square',
                        radius: 4
                    }
                }]
            });
        }

        makechart_oee(Mockdata);
        makechart_give_away(Mockdata.OEEDataListPP12A);
    </script>
