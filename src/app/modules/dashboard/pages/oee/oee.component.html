<div class="container bg-background min-h-screen">
  <!-- Header -->
  <div class="bg-slate-800 text-white p-4 shadow-lg">
    <h1 class="text-4xl font-bold text-center py-4">OEE ALL MACHINES</h1>
  </div>

  <!-- Navigation Buttons: ปรับพื้นหลังและขอบให้ต่างจากกราฟ -->
  <div class="nav-buttons sticky top-16 z-30 flex flex-wrap gap-2 justify-center p-4 bg-white/60 border border-blue-400 rounded-lg shadow-md">
    <app-button *ngFor="let machine of orderedMachines"
                (buttonClick)="scrollToChart(machine)"
                [tone]="currentTheme"
                [impact]="'bold'"
                [shape]="'rounded'"
                [shadow]="'small'">
      {{ machine.replace('oeeDataList', '').slice(0, -1) + ' LINE ' + machine.slice(-1) }}
    </app-button>
  </div>

  <!-- Loading and Error States -->
  <div *ngIf="loading" class="text-foreground p-4">Loading charts...</div>
  <div *ngIf="error" class="text-destructive p-4">{{ error }}</div>

  <!-- Charts Section -->
  <div *ngIf="!loading && !error && !!chartOptions" 
       class="charts-container p-4 space-y-4">
    <ng-container *ngFor="let machine of orderedMachines">
      <div *ngIf="chartOptions[machine]" 
           [id]="machine"
           class="bg-card text-card-foreground rounded-lg shadow-lg p-2 border border-white h-auto min-h-[500px]"> <!-- เพิ่ม h-[800px] -->
        <highcharts-chart
          class="w-full h-full block"  
          [Highcharts]="Highcharts"
          [options]="chartOptions[machine]"
          [update]="true">
        </highcharts-chart>
      </div>
    </ng-container>
  </div>

</div> <!-- ปิด container div ก่อน -->

<!-- Go to Top Button -->
<button 
  #gotoTopBtn
  [class.hidden]="!showGoToTop"
  class="fixed right-8 bottom-8 z-[9999] bg-violet-600 text-white border-none rounded-full w-14 h-14 shadow-lg flex items-center justify-center text-2xl opacity-85 transition-all duration-300 ease-in-out transform hover:bg-violet-300 hover:text-gray-900 hover:opacity-100 hover:scale-110"
  (click)="scrollToTop()">
  <span class="transform -translate-y-0.5">↑</span>
</button>
