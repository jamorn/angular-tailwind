<div class="container mx-auto bg-background min-h-screen">
  <!-- Header -->
  <div class="bg-slate-800 text-white p-4">
    <h1 class="text-4xl font-bold text-center py-4">OEE ALL MACHINES</h1>
  </div>

  <!-- Navigation Buttons -->
  <div class="nav-buttons sticky top-16 z-30 flex flex-wrap gap-2 justify-center p-4 bg-card/95">
    <app-button *ngFor="let machine of orderedMachines"
              (buttonClick)="scrollToChart(machine)"
              [tone]="'primary'"
              [impact]="'bold'"
              [shape]="'rounded'"
              [shadow]="'small'">
      {{ machine.replace('oeeDataList', '').slice(0, -1) + ' LINE ' + machine.slice(-1) }}
    </app-button>
  </div>

  <!-- Charts Section -->
  <div *ngIf="!loading && !error && !!chartOptions" class="p-4">
    <ng-container *ngFor="let machine of orderedMachines">
      <div *ngIf="chartOptions[machine]" 
           [id]="machine"
           class="bg-card text-card-foreground rounded-lg shadow-lg p-4 mb-4">
        <highcharts-chart
          [Highcharts]="Highcharts"
          [options]="chartOptions[machine]"
          [update]="true">
        </highcharts-chart>
      </div>
    </ng-container>
  </div>
</div>
