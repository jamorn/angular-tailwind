<div class="w-full px-6 mt-8">
  <!-- แยก scale-125 ออกจาก wrapper div -->
  <h2 class="text-2xl font-bold mb-4 text-foreground/80 scale-125 transform-gpu">Status Plant</h2>
  
  <!-- Content wrapper without scale -->
  <div class="mb-6">
    <!-- Updated Tab Navigation with better contrast -->
    <div class="border-b border-border/40">
      <nav class="flex space-x-2">
        <button *ngFor="let tab of getTabs()"
          type="button"
          (click)="setActiveTab(tab)"
          [class.bg-primary]="activeTab() === tab"
          [class.text-primary-foreground]="activeTab() === tab"
          [class.text-muted-foreground]="activeTab() !== tab"
          [class.hover:text-foreground]="activeTab() !== tab"
          [class.border-b-2]="activeTab() === tab"
          [class.border-primary]="activeTab() === tab"
          class="px-4 py-2 text-sm font-medium transition-colors relative group">
          <span>{{tab}}</span>
          <!-- Indicator สำหรับ Tab ที่ไม่มีข้อมูล -->
          <span *ngIf="!hasDataForTab(tab)" 
                class="absolute -top-1 -right-1 w-2 h-2 bg-destructive/60 rounded-full">
          </span>
          <!-- Tooltip แสดงสถานะข้อมูล -->
          <span class="absolute hidden group-hover:block -top-8 left-1/2 -translate-x-1/2 px-2 py-1 bg-popover text-xs rounded shadow-lg whitespace-nowrap">
            {{hasDataForTab(tab) ? 'มีข้อมูล' : 'ไม่มีข้อมูล'}}
          </span>
        </button>
      </nav>
    </div>

    <!-- Table Content Area -->
    <div class="mt-6">
      <div class="border-muted/20 bg-background flex min-w-full flex-col rounded-xl border p-2">
        <div class="scrollbar-thumb-rounded scrollbar-track-rounded scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted grow overflow-x-auto px-5">
          <table class="text-muted-foreground table w-full table-auto border-collapse border-0 text-left align-middle leading-5">
            <thead class="border-muted/20 text-muted-foreground border text-xs">
              <tr>
                <th class="px-6 py-3">Item</th>
                <th class="px-6 py-3">Description</th>
                <th class="px-6 py-3">Action By</th>
                <th class="px-6 py-3">Issue Date</th>
                <th class="px-6 py-3">Due Date</th>
              </tr>
            </thead>
            <tbody>
              <!-- No Data Message -->
              <tr *ngIf="!getCurrentData().length">
                <td colspan="5" class="px-6 py-8 text-center text-muted-foreground">
                  <div class="flex flex-col items-center justify-center gap-2">
                    <span class="text-lg">ไม่พบข้อมูล</span>
                    <span class="text-sm">
                      ไม่พบข้อมูลสำหรับ {{activeTab()}} ในระบบ
                    </span>
                  </div>
                </td>
              </tr>
              <!-- Data Rows -->
              <tr *ngFor="let item of getCurrentData()" class="hover:bg-card/50">
                <td class="px-6 py-4 text-sm">{{item.item}}</td>
                <td class="px-6 py-4 text-sm">{{item.description}}</td>
                <td class="px-6 py-4 text-sm">{{item.actionBy}}</td>
                <td class="px-6 py-4 text-sm">{{item.issueDate | date:'dd/MM/yyyy'}}</td>
                <td class="px-6 py-4 text-sm">{{item.dueDate | date:'dd/MM/yyyy'}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
