<div class="w-full">
  <!-- Header with title -->
  <h2 class="text-2xl font-bold mb-4 text-foreground/80 ml-6">Status Plant</h2>

  <!-- Tab Navigation with Badges -->
  <div class="flex gap-2 px-6 mb-4 overflow-x-auto">
    <button *ngFor="let tab of getTabs()"
            (click)="setActiveTab(tab)"
            [class]="tab === activeTab() ? 
              'bg-primary text-white shadow-lg' : 
              'bg-card hover:bg-card/80 text-foreground/70'"
            class="px-6 py-2.5 rounded-lg font-medium text-sm
                   transition-all duration-200 transform hover:-translate-y-0.5
                   border border-border/20 flex items-center gap-2">
      <!-- Tab Name -->
      <span>{{ tab }}</span>
      
      <!-- Badge with Item Count (Always Show) -->
      <span [class]="tab === activeTab() ? 
              'bg-white/20 text-white' : 
              getDataCountForTab(tab) === 0 ? 
                'bg-muted/30 text-muted-foreground' : 
                'bg-primary/10 text-primary'"
          class="inline-flex items-center justify-center
                 min-w-[1.5rem] h-5 px-1.5 text-xs font-medium
                 rounded-full">
        {{ getDataCountForTab(tab) }}
      </span>
    </button>
  </div>

  <!-- Content Area -->
  <div class="px-6">
    <!-- Container with conditional background -->
    <div class="rounded-lg border border-border/40 overflow-hidden">
      <div class="relative w-full overflow-auto">
        <!-- Table with conditional styling -->
        <table class="w-full caption-bottom text-sm dark:bg-[#1e1e1e] bg-[#fcfdfd]">
          <!-- Header with conditional background -->
          <thead class="[&_tr]:border-b border-border/50 dark:bg-[#1e1e1e] bg-[#fcfdfd]">
            <tr class="transition-colors hover:bg-muted/5">
              <th class="h-12 px-4 text-left align-middle font-medium dark:text-muted-foreground text-gray-700 [&:has([role=checkbox])]:pr-0">
                Item
              </th>
              <th class="h-12 px-4 text-left align-middle font-medium dark:text-muted-foreground text-gray-700 [&:has([role=checkbox])]:pr-0">
                Description
              </th>
              <th class="h-12 px-4 text-left align-middle font-medium dark:text-muted-foreground text-gray-700 [&:has([role=checkbox])]:pr-0">
                Action By
              </th>
              <th class="h-12 px-4 text-left align-middle font-medium dark:text-muted-foreground text-gray-700 [&:has([role=checkbox])]:pr-0">
                Issue Date
              </th>
              <th class="h-12 px-4 text-left align-middle font-medium dark:text-muted-foreground text-gray-700 [&:has([role=checkbox])]:pr-0">
                Due Date
              </th>
            </tr>
          </thead>
          
          <tbody class="[&_tr:last-child]:border-0">
            <!-- No Data Message with conditional styling -->
            <tr *ngIf="!getCurrentData().length" 
                class="border-b border-border/50 transition-colors dark:bg-[#1e1e1e] bg-[#fcfdfd]">
              <td colspan="5" class="p-4 align-middle [&:has([role=checkbox])]:pr-0">
                <div class="flex h-[120px] flex-col items-center justify-center gap-2 text-center">
                  <p class="text-sm dark:text-muted-foreground text-gray-600">
                    ไม่พบข้อมูลสำหรับ {{activeTab()}}
                  </p>
                </div>
              </td>
            </tr>
            
            <!-- Data Rows with conditional colors -->
            <tr *ngFor="let item of getCurrentData(); let i = index" 
                class="border-b border-border/50 transition-colors 
                       dark:even:bg-muted/5 even:bg-gray-50
                       dark:hover:bg-muted/10 hover:bg-gray-100">
              <td class="p-4 align-middle dark:text-foreground text-gray-900 [&:has([role=checkbox])]:pr-0">
                {{ i + 1 }}
              </td>
              <td class="p-4 align-middle dark:text-foreground text-gray-900 [&:has([role=checkbox])]:pr-0">
                {{item.description}}
              </td>
              <td class="p-4 align-middle dark:text-foreground text-gray-900 [&:has([role=checkbox])]:pr-0">
                {{item.actionBy}}
              </td>
              <td class="p-4 align-middle dark:text-foreground text-gray-900 [&:has([role=checkbox])]:pr-0">
                {{item.issueDate | date:'dd/MM/yyyy'}}
              </td>
              <td class="p-4 align-middle dark:text-foreground text-gray-900 [&:has([role=checkbox])]:pr-0">
                {{item.dueDate | date:'dd/MM/yyyy'}}
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
